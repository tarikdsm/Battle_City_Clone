<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battle City</title>
    <!--
      An inline icon, not a file. Without one the browser asks for
      /favicon.ico on every load and logs the 404 as a console ERROR — which
      the e2e smoke never caught, because headless Chromium does not request a
      favicon at all and headed Chromium does (found by `npm run capture:play`,
      which drives a headed browser for the real GPU).
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a0a'/%3E%3Crect x='3' y='7' width='10' height='6' rx='1' fill='%23d8b24a'/%3E%3Crect x='7' y='2' width='2' height='6' fill='%23d8b24a'/%3E%3C/svg%3E"
    />
    <!--
      Art §10's UI treatment. Linked here rather than imported from a module:
      the app program compiles with `types: []`, so an `import './styles.css'`
      would need an ambient module declaration purely to satisfy a build step
      that Vite handles from a <link> without one. Vite rewrites this path in a
      production build and respects `--mode pages`' base path.
    -->
    <!--
      Art §10's two OFL faces, bundled (no runtime network — GDD pillar 4).
      Preloaded because `font-display: swap` would otherwise paint the title in
      the fallback and reflow it a moment later; `crossorigin` is required even
      for same-origin font preloads, or the browser fetches the file twice.
    -->
    <link
      rel="preload"
      href="/src/ui/fonts/orbitron-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/ui/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/ui/styles.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        overflow: hidden;
      }
      /*
        Taken out of flow and pinned to the top-left. The renderer sets this
        element's pixel size (`WebGLRenderer.setSize` writes the inline width
        and height), and the play screen sizes it to the viewport MINUS the
        HUD dock — so the board area and the HUD are disjoint boxes rather
        than one box with the other painted over it (GDD §9, art §10).
      */
      #game {
        display: block;
        position: fixed;
        left: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
